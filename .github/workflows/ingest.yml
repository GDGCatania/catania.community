name: Collect events

on:
  # Twice a day. Times are UTC and deliberately off the hour: GitHub Actions
  # cron jobs run closer to schedule away from round minutes, when the global
  # queue is saturated.
  schedule:
    - cron: '17 4 * * *'
    - cron: '17 16 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Re-fetch events from this date (YYYY-MM-DD)'
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The tests run on fixtures with no network access: if an adapter is
      # broken, better to find out here than by writing bad data to the repo.
      - name: Adapter tests
        run: npm test

      - name: Collect
        id: ingest
        run: |
          if [ -n "${{ inputs.since }}" ]; then
            npm run ingest -- --since "${{ inputs.since }}"
          else
            npm run ingest
          fi
        # Exit code 1 = no source responded. That must not stop the workflow:
        # the existing data is still valid and the issue needs to be opened.
        continue-on-error: true

      - name: Commit the updated data
        id: commit
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The message goes through a file: passing it inline to -m would mean
          # nesting the script's quotes inside the shell's.
          node tools/commit-message.mjs > /tmp/commit-message.txt
          cat /tmp/commit-message.txt

          git config user.name  'catania-community-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git commit -F /tmp/commit-message.txt
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update the issue about failing sources
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('data/ingest-report.json')) return;

            const report = JSON.parse(fs.readFileSync('data/ingest-report.json', 'utf8'));
            const failed = report.sources.filter((s) => !s.ok);
            const LABEL = 'ingest-failure';
            const TITLE = 'Fonti di eventi non raggiungibili';

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: LABEL,
              state: 'open',
            });
            const existing = open.find((issue) => issue.title === TITLE);

            if (failed.length === 0) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: 'Tutte le fonti hanno risposto correttamente. Chiudo.',
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                });
              }
              return;
            }

            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `${failed.length} font${failed.length === 1 ? 'e' : 'i'} non ha risposto nell'ultimo run.`,
              '',
              'Gli eventi già raccolti **restano pubblicati**: il sito non si è svuotato.',
              '',
              '| Community | Adapter | Errore |',
              '| --- | --- | --- |',
              ...failed.map((s) => `| \`${s.community}\` | \`${s.type}\` | ${s.error ?? '—'} |`),
              '',
              `[Log del run](${run})`,
            ].join('\n');

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: TITLE,
                labels: [LABEL],
                body,
              });
            }

  # Pushes made with GITHUB_TOKEN do not fire the `push` event, so the deploy
  # has to be called explicitly: without this the site would stay frozen at the
  # last human commit.
  deploy:
    needs: ingest
    if: needs.ingest.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
