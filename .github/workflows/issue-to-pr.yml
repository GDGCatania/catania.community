name: From report to pull request

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-pr:
    # Must match `issueLabels.newCommunity` in site.config.ts.
    if: github.event.label.name == 'new-community'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Generate the YAML file from the report
        id: generate
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -o pipefail
          # The body goes through stdin: inlining it would expose it to shell
          # interpretation.
          if ! SLUG=$(printf '%s' "$ISSUE_BODY" | npx tsx tools/issue-to-yaml.ts 2> /tmp/err.txt); then
            {
              echo "error=$(cat /tmp/err.txt)"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Check the project still builds with the new community
        run: |
          npm test
          npm run build

      - name: Open the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ steps.generate.outputs.slug }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          BRANCH="community/$SLUG"
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add "sources/communities/$SLUG.yml"
          git commit -m "feat(community): add $SLUG (closes #$ISSUE)"
          # `community/<slug>` is reserved for this bot and its content is derived
          # from the issue on every run, so replacing the branch is safe. It is also
          # what lets a retry work after a failed run left a branch behind.
          git push --force -u origin "$BRANCH"

          cat > /tmp/pr-body.md <<'EOF'
          Generated automatically from a report.

          **Before merging, check:**

          - [ ] The links really lead to the right community
          - [ ] The chosen topics make sense
          - [ ] If the adapter is `bevy`, `chapter` has been filled in with the numeric
                id (read it from `https://gdg.community.dev/<slug>/`, looking for
                `chapter/<id>`) and the `_todo` line has been removed
          - [ ] If the adapter is `jsonld`, the address in `list` really is the group's
                events page, and `npm run ingest -- --source <slug> --dry-run` reads it
                (zero events is normal if nothing is scheduled)

          Once merged the community is online and its events are collected on the next run.
          EOF
          printf '\nCloses #%s\n' "$ISSUE" >> /tmp/pr-body.md

          # On a retry the pull request may already be open; the force push above
          # has just updated it, so reuse it instead of failing.
          URL=$(gh pr create \
            --title "New community: $SLUG" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "$BRANCH" 2>/dev/null) || URL=$(gh pr view "$BRANCH" --json url --jq .url)

          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment on the report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const pr = ${{ toJSON(steps.pr.outputs.url) }};
            const slug = ${{ toJSON(steps.generate.outputs.slug) }};
            const failure = ${{ toJSON(steps.generate.outputs.error) }};
            const repo = `${context.repo.owner}/${context.repo.repo}`;

            // Three outcomes, not two. Reporting "I could not generate the file"
            // when the file is written, committed and pushed sends whoever reported
            // the community looking for a problem that is not there.
            let body;

            if (pr) {
              body = [
                `Thank you. The report is now a pull request: ${pr}`,
                '',
                'Once it is merged the community will be online and its events collected automatically.',
              ].join('\n');
            } else if (slug) {
              body = [
                'Thank you. The community file is ready on the branch',
                `[\`community/${slug}\`](https://github.com/${repo}/tree/community/${slug}),`,
                'but I could not open the pull request myself.',
                '',
                `**[Open it here](https://github.com/${repo}/compare/main...community/${slug}?expand=1)**:`,
                'the work is done, it is one click away.',
              ].join('\n');
            } else {
              body = [
                'I could not generate the file from this report.',
                failure ? `\n\`\`\`\n${failure}\n\`\`\`` : '',
                '\nNothing serious: the report still stands and we will handle it by hand.',
              ].join('\n');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
